    <script>
      (function() {
        // Safe toISOString polyfill to prevent RangeError: Invalid time value crashes
        var origToISO = Date.prototype.toISOString;
        Date.prototype.toISOString = function() {
          if (isNaN(this.getTime())) {
            return new Date().toISOString();
          }
          return origToISO.call(this);
        };
        // Global error boundary & error logger
        window.addEventListener('error', function(e) {
          console.warn('Recovered from window error:', e.message || e.error);
        });
        window.addEventListener('unhandledrejection', function(e) {
          console.warn('Recovered from unhandled rejection:', e.reason);
        });
      })();
    </script>
